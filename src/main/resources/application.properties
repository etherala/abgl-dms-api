spring.application.name=abgl-dms-api
# API response locale; message bundles are messages_<language>.properties.
app.language=en
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

server.port=8081

# Database configuration
spring.datasource.url=jdbc:postgresql://codemaker.abytegroup.com:15432/alphadocs
spring.datasource.username=mtadmin
spring.datasource.password=ABGL46Strong
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Captcha settings
captcha.hmac-secret=change_me
captcha.ttl-minutes=5
captcha.cleanup-rate-ms=60000

# Authentication lockout
auth.lockout.max-failed-attempts=5
auth.lockout.duration-minutes=15

# Logging
logging.level.root=INFO
logging.level.com.abgl.dms.controller.CaptchaController=INFO
logging.level.com.abgl.dms.controller.AuthController=INFO
logging.level.com.abgl.dms.auth=INFO

# Captcha rate limiting
captcha.rate-limit.enabled=true
captcha.rate-limit.capacity=5
captcha.rate-limit.refill-tokens=5
captcha.rate-limit.refill-seconds=60

# upload file size limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#allowed and not allowed file types
file.upload.allowed-types=pdf,doc,docx,xls,xlsx,ppt,pptx,txt,jpg,jpeg,png,gif
file.upload.not-allowed-types=exe,dll,bat.cmd,ps1,js,html,htm,svg,php,sh,jar,war,py,ruby,pl

#upload file storage and quarantine paths
file.upload.storage-path=D:/abgl/alphadocs/doc_store
file.upload.quarantine-path=D:/abgl/alphadocs/quarantine
file.upload.clamav.host=127.0.0.1
file.upload.clamav.port=3310
file.upload.clamav.timeout-ms=30000
file.upload.clamav.enabled=false
